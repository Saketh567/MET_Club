<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - MET Club</title>
  <meta name="description" content="Discover upcoming events, workshops, and hackathons at MET Club.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https://images.unsplash.com; media-src 'self' https://assets.mixkit.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; frame-src 'self' https://player.vimeo.com;">
  <meta name="theme-color" content="#f5f1eb">

<body>

  <!-- NAVBAR SECTION -->
  <!-- Navbar injected by script.js from components/navbar.html -->
  <div id="site-navbar"></div>

  <!-- SHOWCASE HERO SECTION (Matches style) -->
  <section class="hero-ocean" id="hero" style="min-height: 55vh; padding-top: 15vh;">
    <div class="hero-ocean-bg">
      <video autoplay loop muted playsinline class="hero-video-bg">
        <source src="assets/videos/oceanwave.mp4" type="video/mp4">
      </video>
      <div class="hero-ocean-overlay"></div>
    </div>
    
    <div class="container hero-ocean-content">
      <div class="hero-ocean-center reveal">
        <h1 class="hero-ocean-title" style="font-size: clamp(3rem, 6vw, 5rem);">Events Calendar</h1>
        <p class="hero-ocean-subtitle">Learn, build, and connect.</p>
        <a href="#dynamic-events-page" class="hero-ocean-btn">Explore Events</a>
      </div>
    </div>
    
    <!-- Wave Transition to next section -->
    <div class="hero-wave" style="position: absolute; bottom: 0; left: 0; width: 100%; overflow: hidden; line-height: 0;">
      <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" style="position: relative; display: block; width: calc(100% + 1.3px); height: 80px;">

      </svg>
    </div>
  </section>

  <!-- EVENTS DETAILED LIST -->
  <section class="about" style="padding-top: 5rem; padding-bottom: 5rem;" id="events-list">
    <div class="container">
      <h2 class="about-title" style="text-align: center; margin-bottom: 4rem;">Upcoming <em>Events</em></h2>
      
      <div id="dynamic-events-page" style="max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 3rem;">
        <!-- Injected via script.js -->
      </div>
    </div>
    
    <!-- Wave Transition to next section -->
    <div class="about-wave" style="position: absolute; bottom: 0; left: 0; width: 100%; overflow: hidden; line-height: 0;">
      <svg data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="none" style="position: relative; display: block; width: calc(100% + 1.3px); height: 80px;">
          <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V120H0V0C50.62,19.34,103.74,40.17,157.81,51.81,211.89,63.44,266.37,66.15,321.39,56.44Z" fill="#ffffff"></path>
      </svg>
    </div>
  </section>

  <!-- CTA SECTION -->
  <section class="connect" style="background: var(--white); padding: 8rem 0;">
    <div class="container" style="text-align: center;">
      <p class="section-label reveal">/ PARTICIPATE</p>
      <h2 class="events-heading reveal" style="font-size: 3.5rem; margin-top: 1rem; margin-bottom: 2rem;">Don't just attend. Participate.</h2>
      <a href="index.html#contact" class="hero-ocean-btn reveal" style="border-color: var(--black); color: var(--black);">Get involved</a>
    </div>
  </section>

  <!-- FOOTER -->
  <!-- Footer injected by script.js from components/footer.html -->
  <div id="site-footer"></div>

  <script src="js/script.js?v=14"></script>
</body>
</html>
